map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # the container listens on 80 but is published on another port; redirects must stay relative
    absolute_redirect off;

    # Docker's DNS, asked again at runtime so a recreated api container (new IP) is still found
    resolver 127.0.0.11 valid=10s;

    # text/html is always compressed; the rest of the text formats have to be listed
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml application/wasm;

    # a location that has an add_header of its own no longer inherits these three,
    # so each such location below repeats them
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /api/ {
        set $api http://api:8000;
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
    }

    location = /admin {
        return 301 /admin/;
    }

    # Vite puts a content hash in every file name here, so these can be cached for good
    location /admin/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    location /admin/ {
        try_files $uri /admin/index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # the WebAssembly build: main.dart.mjs must be served as JavaScript, and the two Cross-Origin headers
    # make the page cross-origin isolated, which lets the skwasm renderer draw on a separate thread
    include mime.types;
    types {
        text/javascript mjs;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header Cross-Origin-Opener-Policy same-origin;
        add_header Cross-Origin-Embedder-Policy credentialless;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # Flutter gives these files the same name at every build; the browser has to ask again each time,
    # otherwise it keeps the old application after a deploy
    location ~ ^/(flutter_bootstrap\.js|flutter\.js|flutter_service_worker\.js|main\.dart\.(js|mjs|wasm)|version\.json|manifest\.json)$ {
        add_header Cache-Control "no-cache";
        add_header Cross-Origin-Opener-Policy same-origin;
        add_header Cross-Origin-Embedder-Policy credentialless;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cross-Origin-Opener-Policy same-origin;
        add_header Cross-Origin-Embedder-Policy credentialless;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
}
