name: flutter_interface

description: A Flutter interface for the VPP Simulator.

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.0.5
  flutter_animate: ^4.0.0
  flutter_svg: ^2.0.7
  path_drawing: ^1.0.1
  google_fonts: ^6.1.0
  http: ^1.1.0
  fl_chart: ^0.69.0
  intl: ^0.19.0
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/casa_zi_fara_lumini.png
    - assets/casa_zi_lumini.png
    - assets/casa_noapte_fara_lumini.png
    - assets/casa_noapte_lumini.png
