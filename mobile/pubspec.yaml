name: flutter_interface

description: Aplicatia Flutter a simulatorului VPP (casa utilizatorului).
publish_to: none

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.1.0
  http: ^1.1.0
  fl_chart: ^0.69.0
  intl: ^0.19.0
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/casa_zi_fara_lumini.png
    - assets/casa_zi_lumini.png
    - assets/casa_noapte_fara_lumini.png
    - assets/casa_noapte_lumini.png
