<!DOCTYPE html>
<html lang="ro">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Centrala electrică virtuală a comunității: producția solară, bateria și schimbul de energie al casei tale.">
  <meta name="theme-color" content="#0A0A0A">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="VPP">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>VPP Comunitate</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { margin: 0; height: 100%; background-color: #0A0A0A; }
    html.vpp-standalone, html.vpp-standalone body { height: var(--vpp-height) !important; }
  </style>
  <script>
    // Flutter replaces the viewport meta at startup and drops viewport-fit=cover.
    new MutationObserver(function () {
      var meta = document.querySelector('meta[name="viewport"]');
      if (meta && meta.content.indexOf('viewport-fit') < 0) {
        meta.content += ', viewport-fit=cover';
      }
    }).observe(document.head, { childList: true });

    window.vppSafeArea = function () {
      var probe = document.getElementById('vpp-safe-area');
      if (!probe) {
        probe = document.createElement('div');
        probe.id = 'vpp-safe-area';
        probe.style.cssText = 'position:fixed;top:0;left:0;visibility:hidden;pointer-events:none;' +
          'padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)';
        document.documentElement.appendChild(probe);
      }
      var s = getComputedStyle(probe);
      return [s.paddingTop, s.paddingRight, s.paddingBottom, s.paddingLeft].map(function (v) {
        return parseFloat(v) || 0;
      });
    };

    // An iOS home-screen app with the black-translucent status bar gets a layout viewport shorter
    // than the screen by the status bar height. Flutter sizes its canvas from documentElement
    // .clientHeight, which left an empty band at the bottom; a full-screen app is the screen size.
    (function () {
      if (window.navigator.standalone !== true) return;
      var root = document.documentElement;
      var nativeHeight = Object.getOwnPropertyDescriptor(Element.prototype, 'clientHeight').get;
      function screenHeight() {
        var landscape = window.innerWidth > window.innerHeight;
        var width = landscape ? Math.max(screen.width, screen.height) : Math.min(screen.width, screen.height);
        var height = landscape ? Math.min(screen.width, screen.height) : Math.max(screen.width, screen.height);
        var own = nativeHeight.call(root);
        // split view or any window narrower than the screen: keep what the browser reports
        return Math.abs(window.innerWidth - width) > 1 ? own : Math.max(own, height);
      }
      function apply() {
        root.style.setProperty('--vpp-height', screenHeight() + 'px');
      }
      root.classList.add('vpp-standalone');
      Object.defineProperty(root, 'clientHeight', { configurable: true, get: screenHeight });
      apply();
      window.addEventListener('resize', apply);
      window.addEventListener('orientationchange', apply);
    })();

    window.vppStandalone = function () {
      return window.navigator.standalone === true ||
        window.matchMedia('(display-mode: standalone)').matches;
    };
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
