# Pornire obisnuita: start.bat. Aplicatia http://localhost:13000, panoul operatorului http://localhost:13000/admin,
# documentatia API http://localhost:18000/docs.
# docker compose down -v sterge si baza de date.
name: licenta-vpp

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vpp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vpp}
      POSTGRES_DB: ${POSTGRES_DB:-vpp}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-15432}:5432"
    healthcheck:
      # prin TCP: serverul temporar din timpul initializarii asculta doar pe socket
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-vpp}:${POSTGRES_PASSWORD:-vpp}@db:5432/${POSTGRES_DB:-vpp}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY in .env (start.bat generates one)}
      JWT_EXPIRE_HOURS: ${JWT_EXPIRE_HOURS:-24}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:13000}
      SIM_CONTROLLER: ${SIM_CONTROLLER:-reguli}
      SIM_TICK_SECONDS: ${SIM_TICK_SECONDS:-2}
      SIM_STEP_MINUTES: ${SIM_STEP_MINUTES:-5}
      SIM_SEED: ${SIM_SEED:-42}
      SIM_START_DATE: ${SIM_START_DATE:-}
      SIM_AUTOSTART: ${SIM_AUTOSTART:-true}
      SIM_DATA: ${SIM_DATA:-real}
      SIM_PRICE_YEAR: ${SIM_PRICE_YEAR:-2025}
      INITIAL_WALLET_LEI: ${INITIAL_WALLET_LEI:-100}
      OPERATOR_WALLET_LEI: ${OPERATOR_WALLET_LEI:-10000}
    ports:
      - "${API_PORT:-18000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  web:
    build:
      context: ./web
      additional_contexts:
        mobile: ./mobile
        admin: ./admin
      args:
        WEATHER_API_KEY: ${WEATHER_API_KEY:-}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-13000}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/admin/"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  pgdata:
