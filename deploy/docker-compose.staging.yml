# Stiva de staging, pe acelasi server, in /opt/vpp-staging, cu propriul .env si propria baza de date.
# Primeste imaginile cu eticheta develop (sau sha-ul) la fiecare push pe develop. Nu are porturi publice:
# caddy din stiva de productie ajunge la web si api prin reteaua comuna vpp-edge (aliasurile staging-*).
# Limitele de memorie sunt mai mici decat la productie, ca ambele stive sa incapa in 1 GB de RAM.
name: vpp-staging

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    command: ["postgres", "-c", "shared_buffers=16MB", "-c", "max_connections=20"]
    environment:
      POSTGRES_USER: vpp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?lipseste din .env}
      POSTGRES_DB: vpp
    volumes:
      - pgdata:/var/lib/postgresql/data
    mem_limit: 128m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U vpp -d vpp"]
      interval: 10s
      timeout: 5s
      retries: 12

  api:
    image: ghcr.io/razvanchirila/licenta-vpp-api:${TAG:-develop}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://vpp:${POSTGRES_PASSWORD}@db:5432/vpp
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?lipseste din .env}
      JWT_EXPIRE_HOURS: ${JWT_EXPIRE_HOURS:-24}
      CORS_ORIGINS: https://${DOMAIN:?lipseste din .env}
      SIM_CONTROLLER: ${SIM_CONTROLLER:-reguli}
      SIM_TICK_SECONDS: ${SIM_TICK_SECONDS:-5}
      SIM_STEP_MINUTES: ${SIM_STEP_MINUTES:-5}
      SIM_SEED: ${SIM_SEED:-42}
      SIM_START_DATE: ${SIM_START_DATE:-}
      SIM_AUTOSTART: ${SIM_AUTOSTART:-true}
      SIM_DATA: ${SIM_DATA:-real}
      SIM_PRICE_YEAR: ${SIM_PRICE_YEAR:-2025}
      INITIAL_WALLET_LEI: ${INITIAL_WALLET_LEI:-100}
      OPERATOR_WALLET_LEI: ${OPERATOR_WALLET_LEI:-10000}
      DEMO_PASSWORD: ${DEMO_PASSWORD:?lipseste din .env}
      ENVIRONMENT: staging
    networks:
      default:
      edge:
        aliases: [staging-api]
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 8
      start_period: 60s
      start_interval: 5s

  web:
    image: ghcr.io/razvanchirila/licenta-vpp-web:${TAG:-develop}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    networks:
      default:
      edge:
        aliases: [staging-web]
    mem_limit: 32m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/admin/"]
      interval: 30s
      timeout: 5s
      retries: 6
      start_period: 30s
      start_interval: 5s

networks:
  edge:
    name: vpp-edge
    external: true

volumes:
  pgdata:
